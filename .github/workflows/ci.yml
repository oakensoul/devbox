name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check commit messages for AI attribution
        run: |
          MERGE_BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          if git log "$MERGE_BASE..HEAD" --format='%B' | grep -iE '^Co-Authored-By:.*\b(claude|anthropic|openai|chatgpt|copilot|gemini|ai\b)'; then
            echo "::error::Found AI co-authorship attribution in commit messages. Remove Co-Authored-By trailers referencing AI tools."
            exit 1
          fi
          echo "Commit messages clean."

      - name: Check PR description for AI attribution
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -iE '(co-authored-by|generated with|powered by|assisted by).*(claude|anthropic|openai|chatgpt|copilot|gemini)'; then
            echo "::error::Found AI attribution in PR description. Remove AI-generated attribution text from the PR body."
            exit 1
          fi
          echo "PR description clean."

  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip and setuptools
        run: pip install --upgrade pip setuptools

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest -m "not integration"

      - name: Audit dependencies
        run: pip-audit

      - name: Verify package builds
        run: |
          python -m build
          twine check dist/*
